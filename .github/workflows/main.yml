name: Build EXE

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install 32-bit Python 2.7 manually
      shell: powershell
      run: |
        $msi = "python-2.7.18.msi"
        Invoke-WebRequest -Uri "https://www.python.org/ftp/python/2.7.18/$msi" -OutFile $msi
        Start-Process msiexec.exe -ArgumentList "/i $msi /qn /norestart TARGETDIR=C:\Python27" -Wait
        echo "C:\Python27;C:\Python27\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install py2exe 0.6.9
      run: |
        python -m pip install --upgrade pip
        python -m pip install py2exe_py2==0.6.9

    - name: Install dependencies (Pygame 1.9.2)
      run: |
        C:\Python27\python.exe -m ensurepip
        C:\Python27\python.exe -m pip install --upgrade pip setuptools
        C:\Python27\python.exe -m pip install pygame==1.9.2

    - name: Build EXE with py2exe
      run: C:\Python27\python.exe setup-win.py py2exe

    - name: Zip dist folder
      run: powershell Compress-Archive -Path dist\* -DestinationPath lostsky.zip

    - name: Upload zipped EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: lostsky-exe
        path: lostsky.zip
