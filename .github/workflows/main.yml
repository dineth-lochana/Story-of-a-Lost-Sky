name: Build EXE

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install 32-bit Python 2.7 manually
      shell: powershell
      run: |
        $msi = "python-2.7.18.msi"
        Invoke-WebRequest -Uri "https://www.python.org/ftp/python/2.7.18/$msi" -OutFile $msi
        Start-Process msiexec.exe -ArgumentList "/i $msi /qn /norestart TARGETDIR=C:\Python27" -Wait
        echo "C:\Python27;C:\Python27\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install dependencies
      run: |
        C:\Python27\python.exe -m ensurepip
        C:\Python27\python.exe -m pip install --upgrade pip setuptools wheel
        # Upgrade to a newer Pygame fork compatible with Python 2.7
        C:\Python27\python.exe -m pip install pygame_sdl2  # or another pygamer variant
        # Install PyInstaller
        C:\Python27\python.exe -m pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        C:\Python27\python.exe -m PyInstaller --onefile --windowed srpg.py

    - name: Zip dist folder
      run: powershell Compress-Archive -Path dist\* -DestinationPath lostsky.zip

    - name: Upload zipped EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: lostsky-exe
        path: lostsky.zip
