name: Build EXE

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python 2.7
      uses: actions/setup-python@v5
      with:
        python-version: '2.7'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install pygame==1.9.1 py2exe

    - name: Build EXE with py2exe
      run: python setup-win.py py2exe

    - name: Zip dist folder
      run: powershell Compress-Archive -Path dist\* -DestinationPath lostsky.zip

    - name: Upload zipped EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: lostsky-exe
        path: lostsky.zip
